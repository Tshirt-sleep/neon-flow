<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080714"><title>NEON FLOW — 粒子躲避</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;600;700&display=swap');
:root{--cyan:#62fff1;--pink:#ff4bd8;--purple:#a078ff;--white:#efffff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080714;color:#fff;font-family:'Noto Sans SC',sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#bg{z-index:0}#fx{z-index:1;pointer-events:none}
.hud{position:fixed;z-index:2;inset:0;pointer-events:none}.brand{position:absolute;top:24px;left:30px}.score-label,.sub{font:600 10px Orbitron,sans-serif;letter-spacing:.24em;color:#99a1cb}.score{font:700 clamp(23px,3vw,34px) Orbitron,sans-serif;letter-spacing:.06em;color:#ecffff;text-shadow:0 0 14px #62fff1;line-height:1.4}.score.bump{animation:bump .3s ease}.best{font:10px Orbitron,sans-serif;letter-spacing:.12em;color:#8186ae}.life-wrap{position:absolute;right:28px;top:20px;display:flex;align-items:center;gap:12px}.life-ring{width:65px;height:65px;filter:drop-shadow(0 0 8px #62fff177)}.life-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring-bg,.ring-fill{fill:none;stroke-width:4}.ring-bg{stroke:#ffffff1a}.ring-fill{stroke:#62fff1;stroke-linecap:round;transition:stroke-dashoffset .28s,stroke .2s;stroke-dasharray:163.36;stroke-dashoffset:0}.life-num{position:absolute;inset:0;display:grid;place-items:center;font:600 13px Orbitron,sans-serif;text-shadow:0 0 10px currentColor}.life-text{font:600 9px Orbitron,sans-serif;letter-spacing:.2em;color:#a7aecb}.life-wrap.damaged{animation:damage .5s}.life-wrap.low .ring-fill{stroke:#ff526f}.life-wrap.low .life-num{color:#ff7386}.top-right{position:relative}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:auto}.panel{width:min(560px,calc(100% - 40px));padding:42px 24px 36px;border:1px solid #a3aaff35;border-radius:22px;background:linear-gradient(145deg,#17142bbb,#0a1020bb);box-shadow:0 0 60px #8e54ff18,inset 0 0 28px #6fffee09;backdrop-filter:blur(14px)}.eyebrow{font:600 10px Orbitron,sans-serif;letter-spacing:.34em;color:#81fff0}.title{font:900 clamp(38px,9vw,78px)/1.1 Orbitron,sans-serif;letter-spacing:.035em;margin:13px 0 8px;background:linear-gradient(100deg,#b39aff 5%,#ff70d4 48%,#5fffee 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px #dc6dff55)}.desc{color:#aeb1cc;font-size:13px;line-height:1.9;margin:14px auto 25px;max-width:390px}.key{display:inline-grid;place-items:center;min-width:25px;height:25px;border:1px solid #ffffff30;border-radius:6px;color:#eafcff;font:11px Orbitron,sans-serif;margin:0 2px;background:#ffffff0c}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{pointer-events:auto;cursor:pointer;border:0;border-radius:9px;padding:13px 23px;background:linear-gradient(110deg,#a565ff,#ff55ce 56%,#4ce9e0);color:#0d1020;font:700 12px Orbitron,'Noto Sans SC',sans-serif;letter-spacing:.12em;box-shadow:0 0 22px #e45bef4d;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 32px #e45bef88}.btn.secondary{background:#ffffff0b;color:#d6dbff;border:1px solid #ffffff30;box-shadow:none}.hidden{display:none!important}.footer{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#747b9e;font:9px Orbitron,sans-serif;letter-spacing:.16em}.sound{pointer-events:auto;position:absolute;right:29px;bottom:22px;border:1px solid #ffffff22;background:#ffffff09;color:#aeb9da;border-radius:999px;padding:8px 12px;font:10px Orbitron,sans-serif;cursor:pointer}.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);font:10px Orbitron,sans-serif;letter-spacing:.22em;color:#dff;opacity:0;transition:opacity .2s;text-shadow:0 0 12px #62fff1}.toast.show{opacity:1}.mobile-hint{display:none}
@keyframes bump{50%{transform:scale(1.14);filter:brightness(1.7)}}@keyframes damage{25%,75%{filter:brightness(2.3) drop-shadow(0 0 18px #ff294c)}50%{transform:scale(1.08)}}
@media(max-width:600px){.brand{left:17px;top:16px}.life-wrap{right:15px;top:13px;gap:7px}.life-ring{width:56px;height:56px}.life-text{display:none}.footer{bottom:18px;font-size:8px}.sound{right:15px;bottom:14px}.mobile-hint{display:block}.panel{padding:35px 18px 30px}}
</style></head>
<body><canvas id="bg"></canvas><canvas id="fx"></canvas>
<div class="hud"><div class="brand"><div class="score-label">SCORE</div><div class="score" id="score">000000</div><div class="best">BEST <span id="best">000000</span></div></div>
<div class="life-wrap" id="lifeWrap"><div class="top-right"><div class="life-ring"><svg viewBox="0 0 60 60"><circle class="ring-bg" cx="30" cy="30" r="26"/><circle class="ring-fill" id="ring" cx="30" cy="30" r="26"/></svg></div><div class="life-num" id="lifeNum">100%</div></div><div class="life-text">VITALITY</div></div>
<div class="toast" id="toast">+100  CLEAR WAVE</div>
<div class="center" id="overlay"><div class="panel"><div class="eyebrow">A NEON SURVIVAL EXPERIENCE</div><div class="title">NEON FLOW</div><div class="sub">MOVE WITH THE LIGHT</div><div class="desc" id="message">穿梭于流光与粒子之间。活得越久，得分越高。<br><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> / <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span> 移动<br>鼠标拖动或触摸屏幕也可以控制</div><div class="actions"><button class="btn" id="start">开始游戏&nbsp; / &nbsp;PLAY</button></div></div></div>
<div class="footer">SURVIVE THE FLOW&nbsp; · &nbsp;CHASE THE LIGHT</div><button class="sound" id="sound">♪&nbsp; SOUND ON</button></div>
<script>
(()=>{'use strict';
const bg=document.querySelector('#bg'),fx=document.querySelector('#fx'),b=bg.getContext('2d'),c=fx.getContext('2d');let W,H,D,raf,last=0,elapsed=0,score=0,health=100,running=false,paused=false,gameOver=false,flash=0,spawn=0,wave=0,shake=0;
const player={x:0,y:0,tx:0,ty:0,r:15,trail:[]},enemies=[],particles=[],stars=[];const keys={};let audio=null,muted=false,ambience=null,best=+(localStorage.getItem('neonFlowBest')||0);
const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),ring=document.querySelector('#ring'),lifeWrap=document.querySelector('#lifeWrap'),lifeNum=document.querySelector('#lifeNum'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),startBtn=document.querySelector('#start'),soundBtn=document.querySelector('#sound'),toast=document.querySelector('#toast');bestEl.textContent=String(best).padStart(6,'0');
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;for(const cv of [bg,fx]){cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px'}b.setTransform(D,0,0,D,0,0);c.setTransform(D,0,0,D,0,0);stars.length=0;for(let i=0;i<Math.floor(W*H/8000);i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5,a:Math.random()*.6+.12,p:Math.random()*6})}addEventListener('resize',resize);resize();
function audioInit(){if(muted)return;if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();const master=audio.createGain();master.gain.value=.22;master.connect(audio.destination);ambience={master,osc:[]};for(const [f,type,g] of [[55,'sine',.08],[82.4,'triangle',.035],[110,'sine',.022]]){let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v).connect(master);o.start();ambience.osc.push(o)}}if(audio.state==='suspended')audio.resume()}
function tone(freq,dur,type='sine',vol=.12,slide=0){if(muted)return;audioInit();if(!audio)return;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ambience.master);o.start(t);o.stop(t+dur+.03)}
function sfx(kind){if(muted)return;if(kind==='score'){tone(660,.12,'sine',.065,210);setTimeout(()=>tone(990,.16,'sine',.045,130),65)}else if(kind==='hit'){tone(190,.55,'sawtooth',.19,-145);tone(720,.6,'sine',.16,-610);tone(1280,.8,'triangle',.12,-1110)}else if(kind==='clear'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.5,'sine',.09),i*75))}else if(kind==='start'){tone(330,.32,'sine',.08,240);setTimeout(()=>tone(520,.4,'sine',.08,220),100)}}
function setScore(v){score=v;scoreEl.textContent=String(Math.floor(score)).padStart(6,'0')}
function setHealth(v){health=Math.max(0,v);ring.style.strokeDashoffset=163.36*(1-health/100);lifeNum.textContent=Math.ceil(health)+'%';lifeWrap.classList.toggle('low',health<=30)}
function position(e){const r=fx.getBoundingClientRect();player.tx=e.clientX-r.left;player.ty=e.clientY-r.top}
let pointer=false;addEventListener('pointerdown',e=>{pointer=true;position(e);if(!running&&!gameOver&&overlay.classList.contains('hidden'))return});addEventListener('pointermove',e=>{if(pointer||e.pointerType==='mouse')position(e)});addEventListener('pointerup',()=>pointer=false);
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&running){paused=!paused;if(paused){overlay.classList.remove('hidden');message.innerHTML='已暂停。准备好后继续你的流光之旅。';startBtn.textContent='继续游戏  /  RESUME'}else{overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function randomEdge(){const side=Math.floor(Math.random()*4);return side===0?{x:Math.random()*W,y:-24}:side===1?{x:W+24,y:Math.random()*H}:side===2?{x:Math.random()*W,y:H+24}:{x:-24,y:Math.random()*H}}
function spawnEnemy(){const p=randomEdge(),dx=player.x-p.x,dy=player.y-p.y,len=Math.hypot(dx,dy)||1,roll=Math.random(),hue=roll<.33?187:roll<.66?310:265;let speed=75+Math.random()*55+Math.min(elapsed*1.4,95),r=roll<.22?10+Math.random()*7:4+Math.random()*5;if(roll>.87)speed*=1.45;enemies.push({x:p.x,y:p.y,vx:dx/len*speed,vy:dy/len*speed,r,hue,life:12})}
function burst(x,y,hue,count,white=false){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=white?80+Math.random()*490:35+Math.random()*270,life=.45+Math.random()*1.25;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:white?1+Math.random()*3:1+Math.random()*2.5,hue:white?0:hue,white,life,max:life,drag:.94+Math.random()*.04})}}
function damage(e){health-=Math.max(5,Math.min(17,e.r*.8));flash=1;shake=13;lifeWrap.classList.remove('damaged');void lifeWrap.offsetWidth;lifeWrap.classList.add('damaged');burst(player.x,player.y,e.hue,68,true);burst(player.x,player.y,e.hue,45);sfx('hit');setHealth(health);if(health<=0)endGame()}
function newGame(){audioInit();sfx('start');enemies.length=particles.length=player.trail.length=0;elapsed=0;spawn=0;wave=0;setScore(0);setHealth(100);player.x=W/2;player.y=H*.55;player.tx=player.x;player.ty=player.y;gameOver=false;paused=false;running=true;overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function endGame(){running=false;gameOver=true;best=Math.max(best,Math.floor(score));localStorage.setItem('neonFlowBest',best);bestEl.textContent=String(best).padStart(6,'0');message.innerHTML=`本次得分 <b style="color:#75fff1;font:700 20px Orbitron">${Math.floor(score).toString().padStart(6,'0')}</b><br>流光仍在，下一次会更远。<br><br><span class="key">ENTER</span> 再来一次`;startBtn.textContent='再次挑战  /  RETRY';overlay.classList.remove('hidden')}
startBtn.addEventListener('click',()=>{if(paused){paused=false;overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}else newGame()});addEventListener('keydown',e=>{if(e.key==='Enter'&&(!running||paused)){if(paused){paused=false;overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop)}else newGame()}});
soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.innerHTML=muted?'♩&nbsp; SOUND OFF':'♪&nbsp; SOUND ON';if(!muted)audioInit();else if(ambience)ambience.master.gain.setTargetAtTime(0,audio.currentTime,.1);else return;if(!muted)ambience.master.gain.setTargetAtTime(.22,audio.currentTime,.2)});
function drawBackground(t,dt){b.clearRect(0,0,W,H);const phase=t*.00012;let g=b.createLinearGradient(W*(.1+Math.sin(phase)*.12),0,W*(.9+Math.cos(phase*.7)*.12),H);g.addColorStop(0,'#090817');g.addColorStop(.36,`hsl(${278+Math.sin(phase)*20} 54% 10%)`);g.addColorStop(.67,`hsl(${322+Math.sin(phase+1)*24} 48% 9%)`);g.addColorStop(1,`hsl(${188+Math.sin(phase+2)*18} 52% 8%)`);b.fillStyle=g;b.fillRect(0,0,W,H);
for(let j=0;j<3;j++){let x=W*(.2+j*.3)+Math.sin(t*.00016+j*2)*W*.16,y=H*(.25+(j%2)*.48)+Math.cos(t*.00011+j)*H*.16,rad=Math.max(W,H)*(.45+.07*Math.sin(t*.0002+j));let rg=b.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,['#a052ff12','#ff47b212','#46ffec10'][j]);rg.addColorStop(1,'transparent');b.fillStyle=rg;b.fillRect(0,0,W,H)}for(const s of stars){s.p+=dt*1.3;b.globalAlpha=s.a*(.7+.3*Math.sin(s.p));b.fillStyle='#d7edff';b.fillRect(s.x,s.y,s.r,s.r)}b.globalAlpha=1;let vignette=b.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.72);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'#03030a9c');b.fillStyle=vignette;b.fillRect(0,0,W,H);if(flash>0){b.fillStyle=`rgba(255,255,255,${flash*.78})`;b.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.3)}}
function glowCircle(ctx,x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=color;ctx.shadowBlur=r*5;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(t,dt){drawBackground(t,dt);c.clearRect(0,0,W,H);c.save();if(shake>0){c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*28)}
for(let i=player.trail.length-1;i>=0;i--){const p=player.trail[i];p.life-=dt;if(p.life<=0){player.trail.splice(i,1);continue}const k=p.life/3,grad=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);grad.addColorStop(0,`hsla(${p.hue},100%,75%,${k*.65})`);grad.addColorStop(1,`hsla(${p.hue},100%,60%,0)`);c.fillStyle=grad;c.beginPath();c.arc(p.x,p.y,p.r*3,0,Math.PI*2);c.fill()}
for(const e of enemies){const hue=`hsl(${e.hue} 100% 67%)`;c.save();c.globalAlpha=.38;c.shadowBlur=e.r*5;c.shadowColor=hue;c.fillStyle=hue;c.beginPath();c.arc(e.x,e.y,e.r,0,7);c.fill();c.globalAlpha=.9;c.strokeStyle=`hsla(${e.hue},100%,85%,.8)`;c.lineWidth=1;c.beginPath();c.arc(e.x,e.y,e.r*.68,0,7);c.stroke();c.restore()}
for(const p of particles){const k=Math.max(0,p.life/p.max),col=p.white?`rgba(240,255,255,${k})`:`hsla(${p.hue},100%,68%,${k})`;glowCircle(c,p.x,p.y,p.r*k,col,k)}
const pr=player.r;let pg=c.createRadialGradient(player.x-pr*.4,player.y-pr*.5,1,player.x,player.y,pr*1.9);pg.addColorStop(0,'#ffffffec');pg.addColorStop(.18,'#83fff2d9');pg.addColorStop(.47,'#b867ffc0');pg.addColorStop(.75,'#ff5bd59a');pg.addColorStop(1,'#54eaff05');c.save();c.globalCompositeOperation='lighter';c.shadowBlur=30;c.shadowColor='#76fff0';c.fillStyle=pg;c.beginPath();c.arc(player.x,player.y,pr*1.9,0,7);c.fill();c.strokeStyle='#dfffffc4';c.lineWidth=1.4;c.beginPath();c.arc(player.x,player.y,pr*.9,0,7);c.stroke();c.restore();let halo=c.createRadialGradient(player.x,player.y,pr*.7,player.x,player.y,pr*3.4);halo.addColorStop(0,'#7affef25');halo.addColorStop(1,'transparent');c.fillStyle=halo;c.beginPath();c.arc(player.x,player.y,pr*3.4,0,7);c.fill();c.restore()}
function loop(now){if(!running||paused)return;const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;setScore(score+dt*(9+Math.min(elapsed*.15,20)));if(Math.floor(score/100)>wave){wave=Math.floor(score/100);toast.classList.add('show');toast.textContent=`+100  FLOW ${String(wave).padStart(2,'0')}`;setTimeout(()=>toast.classList.remove('show'),700);burst(player.x,player.y,185,22);sfx('score')}
let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){const n=Math.hypot(dx,dy);player.tx=player.x+dx/n*290*dt;player.ty=player.y+dy/n*290*dt}player.tx=Math.max(16,Math.min(W-16,player.tx));player.ty=Math.max(16,Math.min(H-16,player.ty));player.x+=(player.tx-player.x)*Math.min(1,dt*12);player.y+=(player.ty-player.y)*Math.min(1,dt*12);if(Math.hypot(player.x-player.trail.at(-1)?.x||99,player.y-player.trail.at(-1)?.y||99)>5)player.trail.push({x:player.x,y:player.y,r:5+Math.random()*7,hue:(now*.09+Math.random()*50)%360,life:3});
spawn+=dt;const interval=Math.max(.12,.72-elapsed*.006);while(spawn>=interval){spawn-=interval;spawnEnemy();if(elapsed>30&&Math.random()<.18)spawnEnemy()}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt;if(e.life<=0||e.x<-50||e.x>W+50||e.y<-50||e.y>H+50){enemies.splice(i,1);continue}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r*.7){enemies.splice(i,1);damage(e)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=p.drag;p.vy*=p.drag;if(p.life<=0)particles.splice(i,1)}draw(now,dt);raf=requestAnimationFrame(loop)}
// idle animation
player.x=player.tx=W/2;player.y=player.ty=H*.55;function idle(t){if(!running){player.x=W/2+Math.sin(t*.0005)*Math.min(34,W*.08);player.y=H*.55+Math.cos(t*.0007)*16;player.trail.push({x:player.x,y:player.y,r:4+Math.random()*4,hue:(t*.06)%360,life:3});if(player.trail.length>45)player.trail.shift();draw(t,.016);raf=requestAnimationFrame(idle)}}raf=requestAnimationFrame(idle);
})();
</script></body></html>
